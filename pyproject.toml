[project]
name = "depweight"
version = "0.1.0"
description = "No solo el grafo de dependencias: cuanto se usa realmente cada una, para saber si de verdad la necesitas entera."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "packaging>=23.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff==0.17.3"]

[project.scripts]
depweight = "depweight.cli:main"

[tool.setuptools.packages.find]
include = ["depweight*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
